<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- ✅ FAVICON / GOOGLE LOGO -->
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ✅ GOOGLE BLUE TITLE -->
  <title>
    NIMI PRIVATE LIMITED | Business Management Platform
  </title>

  <!-- ✅ GOOGLE DESCRIPTION -->
  <meta name="description"
    content="NIMI PRIVATE LIMITED - Comprehensive ERP Business Management Platform for streamlined operations." />

  <!-- ✅ KEYWORDS -->
  <meta name="keywords"
    content="NIMI PRIVATE LIMITED, ERP, business management, HR, payroll, attendance, CRM, project management" />

  <meta name="author" content="NIMI PRIVATE LIMITED" />
  <meta name="robots" content="index, follow" />

  <!-- ✅ GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" crossorigin="anonymous" />

  <!-- ============================= -->
  <!-- ✅ SITE NAME (Logo ke bagal me jo naam aata hai) -->
  <!-- ============================= -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "NIMI PRIVATE LIMITED",
        "alternateName": "NIMI ERP",
        "url": "https://erp.nimipl.com"
      }
    </script>

  <!-- ============================= -->
  <!-- ✅ ORGANIZATION (Google search logo) -->
  <!-- ============================= -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "NIMI PRIVATE LIMITED",
        "url": "https://nimipl.com",
        "logo": "https://nimipl.com/logo.png"
      }
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
