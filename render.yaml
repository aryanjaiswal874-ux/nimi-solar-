services:
  - type: web
    name: nimi-erp
    env: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm ci
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health
    envVars:
      # App
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TZ
        value: Asia/Kolkata
      - key: DB_DIALECT
        value: postgres

      # Database (auto-filled from database below)
      - key: DATABASE_URL
        fromDatabase:
          name: nimi-db
          property: connectionString

      # Auth
      - key: JWT_SECRET
        generateValue: true

      # Company Branding
      - key: COMPANY_NAME
        value: "NIMI PRIVATE LIMITED"
      - key: COMPANY_SHORT_NAME
        value: ERP
      - key: COMPANY_TAGLINE
        value: "Business Management Platform"
      - key: COMPANY_ADDRESS
        value: "NIMI PRIVATE LIMITED, Registered Office Address"
      - key: COMPANY_CITY
        value: City
      - key: COMPANY_STATE
        value: State
      - key: COMPANY_PINCODE
        value: "PINCODE"
      - key: COMPANY_PHONE
        value: "+91-XXXXXXXXXX"
      - key: COMPANY_EMAIL
        value: info@nimipl.com
      - key: COMPANY_WEBSITE
        value: https://nimipl.com
      - key: COMPANY_WHATSAPP
        value: "+91-XXXXXXXXXX"
      - key: COMPANY_LOGO_URL
        value: https://nimipl.com/logo.png

      # Frontend URLs (UPDATE AFTER VERCEL DEPLOY)
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app
      - key: FRONTEND_LOGIN_URL
        value: https://your-frontend.vercel.app/auth/login

      # Email / SMTP
      - key: SMTP_HOST
        value: info@nimipl.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: info@nimipl.com
      - key: SMTP_PASS
        value: nimi@2026
      - key: DEFAULT_FROM_EMAIL
        value: info@nimipl.com

      # Certificate Signatory
      - key: CERT_SIGNATORY_NAME
        value: "NIMI PRIVATE LIMITED Authorized Signatory"
      - key: CERT_SIGNATORY_ROLE
        value: "NIMI PRIVATE LIMITED Authorized Signatory"

      # Puppeteer - Render has chromium
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"

databases:
  - name: nimi-db
    databaseName: erp_nimi
    user: erp_user
    plan: free
    region: singapore